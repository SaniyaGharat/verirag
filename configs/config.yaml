# VeriRAG Configuration
# Indian Legal Documents Corpus (ILDC) Verification Pipeline

corpus:
  name: "jayadityagandham9/ILDC_35k_COMPLETE"
  eval_name: "anuragiiser/ILDC_expert"
  cleaned_v4_path: "data/processed/ildc_cleaned_v4.parquet"
  cleaned_dedup_path: "data/processed/ildc_v4_dedup.parquet"
  chunks_path: "data/processed/chunks.parquet"
  use_dedup: true

retriever:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  index_type: "faiss-flat-ip"
  distance_metric: "inner_product"
  index_path: "data/processed/faiss_index.bin"
  metadata_path: "data/processed/chunk_metadata.parquet"
  bm25_index_path: "data/processed/bm25_index.pkl"

generator:
  llm_model: "claude-3-5-sonnet-20241022"
  temperature: 0.2
  max_tokens: 1024
  prompt_template: "generator/prompts/qa_prompt.txt"

decomposer:
  method: "llm-prompted"
  fallback_method: "rule-based"
  llm_model: "claude-3-5-sonnet-20241022"
  granularity: "atomic_proposition"
  prompt_template: "decomposer/prompts/decomposition_prompt.txt"

verifier:
  model_type: "nli-cross-encoder"
  model_name: "cross-encoder/nli-deberta-v3-base"
  threshold_supported: 0.70
  threshold_contradicted: 0.70
  temperature: 0.0
  enable_legal_checks: true

aggregator:
  strategy: "weighted_average"
  citation_linking: "strict"
  uncertainty_handling: "flag_unsupported"
  overall_threshold: 0.70
